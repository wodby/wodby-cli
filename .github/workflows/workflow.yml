name: Build

on:
  push:
    branches:
    - '2.0'

    tags:
    - '*'

  pull_request:

env:
  VERSION: ${{ github.ref_type == 'tag' && github.ref_name || '2.0-dev' }}
  AWS_S3_BUCKET: ${{ secrets.AWS_S3_BUCKET }}
  SOURCE_DIR: dist

jobs:
  build-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        os: [ linux,darwin,windows ]
        arch: [ amd64,arm64 ]
        exclude:
        - os: windows
          arch: arm64
    env:
      GOOS: ${{ matrix.os }}
      GOARCH: ${{ matrix.arch }}
    steps:
    - uses: actions/checkout@v6
    - name: Install Go
      uses: actions/setup-go@v6
      with:
        go-version: 1.26
    - name: build
      run: make VERSION="${VERSION}"
    - name: test
      if: ${{ matrix.os == 'linux' && matrix.arch == 'amd64' }}
      run: make test VERSION="${VERSION}"
    - name: package
      run: make package
    - name: Upload production artifacts
      uses: actions/upload-artifact@v7
      with:
        name: dist-${{ matrix.os }}-${{ matrix.arch }}
        path: dist
        retention-days: 1

  release-aws-20:
    runs-on: ubuntu-latest
    needs: [build-test]
    if: github.event_name == 'push' && github.ref == 'refs/heads/2.0'
    strategy:
      matrix:
        os: [ linux,darwin,windows ]
        arch: [ amd64,arm64 ]
        exclude:
        - os: windows
          arch: arm64
    steps:
    - name: 'Download Artifact'
      uses: actions/download-artifact@v8
      with:
        name: dist-${{ matrix.os }}-${{ matrix.arch }}
        path: dist
    - name: release aws dev
      uses: jakejarvis/s3-sync-action@v0.5.1
      with:
        args: --acl public-read --follow-symlinks --delete
      env:
        AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
        AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        DEST_DIR: wodby-cli/${{ env.VERSION }}/${{ matrix.os }}/${{ matrix.arch }}

  docs:
    name: Update CLI docs
    runs-on: ubuntu-latest
    needs: [build-test]
    if: github.event_name == 'push' && github.ref == 'refs/heads/2.0'
    env:
      MACHINE_USER: ${{ secrets.MACHINE_USER }}
      MACHINE_USER_API_TOKEN: ${{ secrets.MACHINE_USER_API_TOKEN }}
      MACHINE_USER_EMAIL: ${{ secrets.MACHINE_USER_EMAIL }}
    steps:
    - uses: actions/checkout@v6
      with:
        persist-credentials: false
    - name: Install Go
      uses: actions/setup-go@v6
      with:
        go-version: 1.26
    - name: Update CLI docs
      run: make docs-update

  release-aws-tagged:
    runs-on: ubuntu-latest
    needs: [build-test]
    if: startsWith(github.ref, 'refs/tags/')
    strategy:
      matrix:
        os: [ linux,darwin,windows ]
        arch: [ amd64,arm64 ]
        exclude:
        - os: windows
          arch: arm64
    steps:
    - name: 'Download Artifact'
      uses: actions/download-artifact@v8
      with:
        name: dist-${{ matrix.os }}-${{ matrix.arch }}
        path: dist
    - name: release aws tagged
      uses: jakejarvis/s3-sync-action@v0.5.1
      with:
        args: --acl public-read --follow-symlinks --delete
      env:
        AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
        AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        DEST_DIR: wodby-cli/${{ github.ref_name }}/${{ matrix.os }}/${{ matrix.arch }}

  create-gh-release:
    runs-on: ubuntu-latest
    needs: [build-test]
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write
    steps:
    - name: Download Artifacts
      uses: actions/download-artifact@v8
      with:
        pattern: dist-*
        path: dist
        merge-multiple: true
    - name: Create Release
      uses: softprops/action-gh-release@v2
      with:
        tag_name: ${{ github.ref_name }}
        name: ${{ github.ref_name }}
        prerelease: false
        generate_release_notes: true
        files: dist/wodby-*.tar.gz
        fail_on_unmatched_files: true

  build-release-image:
    runs-on: ubuntu-latest
    needs: [build-test]
    if: github.event_name == 'push' && (github.ref == 'refs/heads/2.0' || startsWith(github.ref, 'refs/tags/'))
    steps:
    - uses: actions/checkout@v6
    - uses: docker/setup-qemu-action@v4
      with:
        platforms: amd64,arm64
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v4
    - name: Login to DockerHub
      uses: docker/login-action@v4
      with:
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}
    - name: Extract Docker metadata
      id: meta
      uses: docker/metadata-action@v6
      with:
        images: wodby/wodby-cli
        flavor: |
          latest=false
        tags: |
          type=raw,value=2.0-dev,enable=${{ github.ref == 'refs/heads/2.0' }}
          type=raw,value=2.0,enable=${{ github.ref_type == 'tag' && startsWith(github.ref_name, '2.0') }}
          type=ref,event=tag
          type=sha
    - name: Build and push image
      uses: docker/build-push-action@v7
      with:
        context: .
        push: true
        build-args: VERSION=${{ env.VERSION }}
        platforms: linux/amd64,linux/arm64
        labels: ${{ steps.meta.outputs.labels }}
        tags: ${{ steps.meta.outputs.tags }}
