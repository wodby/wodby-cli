name: Update Release Notes

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to update
        required: true
      notes:
        description: Markdown release notes
        required: true

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
    - name: Update release notes
      env:
        GH_TOKEN: ${{ github.token }}
        NOTES: ${{ inputs.notes }}
        TAG: ${{ inputs.tag }}
      run: gh release edit "${TAG}" --notes "${NOTES}"
