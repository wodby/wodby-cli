name: Build

on:
  push:
    branches:
    - master
    tags:
    - '*'
  pull_request:

permissions:
  contents: read

env:
  VERSION: ${{ github.ref_type == 'tag' && github.ref_name || 'dev' }}
  AWS_S3_BUCKET: ${{ secrets.AWS_S3_BUCKET }}
  SOURCE_DIR: dist

jobs:
  build-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        os: [ linux,darwin,windows ]
        arch: [ amd64,arm64 ]
        exclude:
        - os: windows
          arch: arm64
    env:
      GOOS: ${{ matrix.os }}
      GOARCH: ${{ matrix.arch }}
    steps:
    - uses: actions/checkout@v6
    - name: Install Go
      uses: actions/setup-go@v6
      with:
        go-version-file: go.mod
    - name: build
      run: make VERSION="${VERSION}"
    - name: unit tests
      if: ${{ matrix.os == 'linux' && matrix.arch == 'amd64' }}
      run: go test ./...
    - name: test
      if: ${{ matrix.os == 'linux' && matrix.arch == 'amd64' }}
      run: make test VERSION="${VERSION}"
    - name: test ci run user and cache integration
      if: ${{ matrix.os == 'linux' && matrix.arch == 'amd64' }}
      run: |
        set -euo pipefail

        WODBY_DOCKER_INTEGRATION=1 go test ./pkg/cicache -run TestDataContainerCacheIntegration

        test_home="${RUNNER_TEMP}/wodby-home"
        context="${RUNNER_TEMP}/wodby-context"
        config="${RUNNER_TEMP}/.wodby-ci.json"
        mkdir -p "${test_home}" "${context}"

        jq -n --arg context "${context}" '{context: $context}' > "${config}"

        # shellcheck disable=SC2016 # Variables expand inside the container.
        HOME="${test_home}" bin/wodby \
          --ci-config-path "${config}" \
          ci run \
          --image wodby/node:24 \
          --env "EXPECTED_UID=$(id -u)" \
          -- sh -eu -c '
            test "$(id -u)" = "${EXPECTED_UID}"
            test "${HOME}" = /tmp
            test "$(npm config get cache)" = /tmp/wodby-cache/npm
            printf cache-ok > /tmp/wodby-cache/npm/wodby-cache-test
          '

        test -f "${context}/.wodby-ci-cache/npm/wodby-cache-test"
        test "$(stat -c %u "${context}/.wodby-ci-cache/npm/wodby-cache-test")" = "$(id -u)"

        data_container="wodby-ci-cache-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
        trap 'docker rm -fv "${data_container}" >/dev/null 2>&1 || true' EXIT
        docker create \
          --name "${data_container}" \
          --volume=/workspace \
          --volume=/tmp/wodby-cache \
          alpine /bin/true

        jq -n \
          --arg context "${context}" \
          --arg data "${data_container}" \
          '{Context: $context, DataContainer: $data, WorkingDir: "/workspace"}' > "${config}"

        HOME="${test_home}" bin/wodby \
          --ci-config-path "${config}" \
          ci run \
          --image wodby/node:24 \
          -- sh -eu -c '
            test "$(id -un)" = node
            test "$(npm config get cache)" = /tmp/wodby-cache/npm
            printf dind-cache-ok > /tmp/wodby-cache/npm/wodby-dind-cache-test
          '

        test -f "${context}/.wodby-ci-cache/npm/wodby-dind-cache-test"
    - name: package
      run: make package
    - name: Upload production artifacts
      uses: actions/upload-artifact@v7
      with:
        name: dist-${{ matrix.os }}-${{ matrix.arch }}
        path: dist
        retention-days: 1

  release-aws-dev:
    runs-on: ubuntu-latest
    needs: [build-test]
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    strategy:
      matrix:
        os: [ linux,darwin,windows ]
        arch: [ amd64,arm64 ]
        exclude:
        - os: windows
          arch: arm64
    steps:
    - name: Download artifact
      uses: actions/download-artifact@v8
      with:
        name: dist-${{ matrix.os }}-${{ matrix.arch }}
        path: dist
    - name: Release AWS dev
      uses: jakejarvis/s3-sync-action@v0.5.1
      with:
        args: --acl public-read --follow-symlinks --delete
      env:
        AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
        AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        DEST_DIR: wodby-cli/dev/${{ matrix.os }}/${{ matrix.arch }}

  release-aws-tagged:
    runs-on: ubuntu-latest
    needs: [build-test]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    strategy:
      matrix:
        os: [ linux,darwin,windows ]
        arch: [ amd64,arm64 ]
        exclude:
        - os: windows
          arch: arm64
    steps:
    - name: Download artifact
      uses: actions/download-artifact@v8
      with:
        name: dist-${{ matrix.os }}-${{ matrix.arch }}
        path: dist
    - name: Release AWS latest
      uses: jakejarvis/s3-sync-action@v0.5.1
      with:
        args: --acl public-read --follow-symlinks --delete
      env:
        AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
        AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        DEST_DIR: wodby-cli/latest/${{ matrix.os }}/${{ matrix.arch }}
    - name: Release AWS tagged
      uses: jakejarvis/s3-sync-action@v0.5.1
      with:
        args: --acl public-read --follow-symlinks --delete
      env:
        AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
        AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        DEST_DIR: wodby-cli/${{ github.ref_name }}/${{ matrix.os }}/${{ matrix.arch }}

  create-gh-release:
    runs-on: ubuntu-latest
    needs: [build-test]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write
    steps:
    - uses: actions/checkout@v6
      with:
        fetch-depth: 0
    - name: Download artifacts
      uses: actions/download-artifact@v8
      with:
        pattern: dist-*
        path: dist
        merge-multiple: true
    - name: Create GitHub release
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        shopt -s nullglob
        assets=(dist/wodby-*.tar.gz)
        if [ ${#assets[@]} -eq 0 ]; then
          echo "::error::No release assets found in dist."
          exit 1
        fi

        gh release create "${GITHUB_REF_NAME}" "${assets[@]}" \
          --verify-tag \
          --title "${GITHUB_REF_NAME}" \
          --notes-from-tag \
          --latest=false

  build-release-image:
    runs-on: ubuntu-latest
    needs: [build-test]
    if: github.event_name == 'push' && (github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/'))
    steps:
    - uses: actions/checkout@v6
    - uses: docker/setup-qemu-action@v4
      with:
        platforms: amd64,arm64
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v4
    - name: Login to DockerHub
      uses: docker/login-action@v4
      with:
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}
    - name: Build and push dev image
      uses: docker/build-push-action@v7
      if: github.ref == 'refs/heads/master'
      with:
        context: .
        push: true
        build-args: VERSION=${{ env.VERSION }}
        platforms: linux/amd64,linux/arm64
        tags: wodby/wodby-cli:dev
    - name: Build and push tagged image
      uses: docker/build-push-action@v7
      if: startsWith(github.ref, 'refs/tags/')
      with:
        context: .
        push: true
        build-args: VERSION=${{ env.VERSION }}
        platforms: linux/amd64,linux/arm64
        tags: wodby/wodby-cli:${{ env.VERSION }},wodby/wodby-cli:latest
