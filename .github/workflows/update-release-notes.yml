name: Update Release Notes

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to update
        required: true
      notes:
        description: Markdown release notes
        required: true
  push:
    branches:
    - 2.0
    paths:
    - .github/release-notes/*.md

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v6
      if: github.event_name == 'push'
    - name: Update release notes from workflow input
      if: github.event_name == 'workflow_dispatch'
      env:
        GH_TOKEN: ${{ github.token }}
        NOTES: ${{ inputs.notes }}
        TAG: ${{ inputs.tag }}
      run: gh release edit "${TAG}" --notes "${NOTES}"
    - name: Update release notes from files
      if: github.event_name == 'push'
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        for notes_file in .github/release-notes/*.md; do
          tag="$(basename "${notes_file}" .md)"
          gh release edit "${tag}" --notes-file "${notes_file}"
        done
